services:
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://demo:demo_password@db:5432/demo
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d demo"]
      interval: 5s
      retries: 10
    volumes:
      - demo_pgdata:/var/lib/postgresql/data
volumes:
  demo_pgdata:
